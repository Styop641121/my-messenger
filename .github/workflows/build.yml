name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "my-messenger 5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download PeerJS library into the app
        run: |
          mkdir -p /tmp/pj
          cd /tmp/pj
          npm init -y > /dev/null
          npm install peerjs@1.5.4
          ls node_modules/peerjs/dist
          cp node_modules/peerjs/dist/peerjs.min.js "$GITHUB_WORKSPACE/my-messenger 5/app/src/main/assets/peerjs.min.js"
          test -s "$GITHUB_WORKSPACE/my-messenger 5/app/src/main/assets/peerjs.min.js"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: my-messenger-apk
          path: my-messenger 5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
